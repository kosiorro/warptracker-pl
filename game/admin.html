<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warptracker PL — Panel Admina</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230a0710' stroke='%23f59e0b' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f59e0b'/%3E%3C/svg%3E" />
    <script type="importmap">
      { "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      } }
    </script>
    <style>
      :root { --purple:#a855f7; --purple-dim:#6b21a8; --gold:#f59e0b; --bone:#d6d3d1; --bg:#0a0710; --panel:#0d0815; --line:#2a1b3d; --input:#140c20 }
      * { box-sizing:border-box; margin:0; padding:0 }
      body { background:var(--bg); color:var(--bone); font-family:Georgia,'Times New Roman',serif; min-height:100vh }
      header { border-bottom:1px solid var(--purple-dim); padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:linear-gradient(180deg,#120a1e,#0a0710) }
      header h1 { color:#e9d5ff; font-size:17px; letter-spacing:.22em; text-transform:uppercase }
      header .status { font-size:11px; color:#71717a; margin-left:auto }
      header .status.on { color:#4ade80 }
      nav { display:flex; gap:4px; flex-wrap:wrap; padding:10px 22px; border-bottom:1px solid var(--line) }
      nav button { background:none; border:1px solid transparent; border-radius:8px 8px 0 0; color:#a1a1aa; font-family:inherit; font-size:12px; letter-spacing:.14em; text-transform:uppercase; padding:9px 16px; cursor:pointer }
      nav button:hover { color:#e9d5ff }
      nav button.act { color:#fde047; border-color:var(--line); border-bottom-color:var(--bg); background:var(--bg) }
      main { padding:20px 22px; max-width:1180px; margin:0 auto }
      .tab { display:none }
      .tab.act { display:block }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px }
      .card h3 { color:#c4b5fd; font-size:12px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:12px }
      .row-flex { display:flex; gap:14px; flex-wrap:wrap }
      .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px }
      label { display:block; color:#a1a1aa; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px }
      input[type=text], input[type=number], select, textarea {
        background:var(--input); border:1px solid #3f2a55; color:#e9d5ff; border-radius:6px;
        padding:7px 10px; font-size:13px; width:100%; font-family:inherit }
      textarea { resize:vertical; min-height:90px; line-height:1.55 }
      input:focus, select:focus, textarea:focus { outline:none; border-color:var(--purple) }
      button.btn { padding:8px 14px; border-radius:7px; border:1px solid #6b21a8; background:rgba(107,33,168,.25);
        color:#e9d5ff; font-family:inherit; font-size:11px; letter-spacing:.09em; cursor:pointer; text-transform:uppercase }
      button.btn:hover { background:rgba(168,85,247,.35) }
      button.btn.green { border-color:#3f6212; background:rgba(63,98,18,.3) }
      button.btn.red { border-color:#7f1d1d; background:rgba(127,29,29,.3) }
      button.btn.gold { border-color:#a16207; background:rgba(161,98,7,.25) }
      button.btn:disabled { opacity:.35; cursor:not-allowed }
      .list { border:1px solid var(--line); border-radius:8px; background:rgba(16,10,26,.6); overflow:auto; max-height:46vh }
      .li { padding:8px 10px; border-bottom:1px solid #221536; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12px }
      .li:hover { background:rgba(168,85,247,.08) }
      .li.sel { background:rgba(168,85,247,.18); border-left:3px solid var(--purple) }
      .li .x { color:#f87171; cursor:pointer; margin-left:auto; padding:0 4px }
      .dot { width:9px; height:9px; border-radius:50%; flex:none }
      .msg { color:#fbbf24; font-size:12px; min-height:16px; margin-top:8px }
      .msg.err { color:#f87171 }
      .hint { color:#71717a; font-size:10.5px; line-height:1.6; margin-top:10px }
      .hint b { color:#a1a1aa }
      #preview3d { width:250px; height:250px; border:1px solid var(--line); border-radius:10px;
        background:radial-gradient(circle at 50% 30%,#191024,#0a0710 75%); position:relative; overflow:hidden; cursor:grab; flex:none }
      #preview3d canvas { display:block }
      #preview3d .pl { position:absolute; bottom:6px; left:0; right:0; text-align:center; color:#71717a; font-size:9.5px; pointer-events:none }
      .npc-card textarea { margin-bottom:8px }
      .npc-card .head { display:flex; align-items:center; gap:10px; margin-bottom:10px }
      .npc-card .head b { color:#e9d5ff; font-size:14px }
      .npc-card .head .id { color:#71717a; font-size:10px; font-family:monospace }
      .badge { display:inline-block; background:rgba(168,85,247,.15); border:1px solid var(--purple-dim); color:#c4b5fd;
        font-size:9.5px; letter-spacing:.1em; border-radius:20px; padding:3px 10px; margin-left:8px; text-transform:uppercase }
    </style>
  </head>
  <body>
    <header>
      <h1>⚔ Warptracker PL — Panel Admina</h1>
      <button class="btn" id="pause-btn" style="margin-left:auto;padding:7px 14px">⏸ Pauza (ESC)</button>
      <div class="status" id="game-status" style="margin-left:0">sprawdzam grę…</div>
    </header>
    <nav id="nav"></nav>
    <main id="main"></main>
    <script type="module" src="assets/admin-app.js"></script>
  </body>
</html>
